# The delivery pipeline for aa-sdlc. Every stage calls a root script with the same arguments a
# person uses locally (O-11, R-24); the pipeline holds no logic of its own. The artifact is
# built once by pack.ps1 and published as is (O-24).
#
# The image carries Go for the CLI and Node for npm pack; PowerShell 7 is installed in
# before_script from Microsoft's package feed because the root scripts are PowerShell. If the
# organisation provides a runner image with pwsh, go, and node, replace the image and delete
# before_script; nothing else changes.

image: golang:1.26-bookworm

variables:
  GIT_DEPTH: "50"
  GOFLAGS: "-mod=readonly"

before_script:
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends wget apt-transport-https software-properties-common ca-certificates gnupg nodejs npm > /dev/null
  - wget -q https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb -O /tmp/msprod.deb && dpkg -i /tmp/msprod.deb > /dev/null
  - apt-get update -qq && apt-get install -y -qq powershell > /dev/null
  - pwsh -NoProfile -Command 'Install-Module Pester, powershell-yaml, PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck'
  - pwsh -NoProfile -Command '$PSVersionTable.PSVersion; go version; node --version'

stages:
  - verify
  - pack

verify:
  stage: verify
  script:
    - pwsh -NoProfile -File ./build.ps1 -Lint
    - pwsh -NoProfile -File ./test.ps1 -Tier unit
    - pwsh -NoProfile -File ./test.ps1 -Tier integration
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pack:
  stage: pack
  script:
    - pwsh -NoProfile -File ./pack.ps1 -SkipTests
    - pwsh -NoProfile -File ./test.ps1 -Tier e2e
  artifacts:
    paths:
      - .dist/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
