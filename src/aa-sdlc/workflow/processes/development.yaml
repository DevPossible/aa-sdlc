id: development
name: Development
summary: >
  From a ready ticket to merged, reviewed code with the tests that prove it.
methodology:
  phase: 2
steps:
  - plan-implementation
  - breakdown-tasks
  - setup-environment
  - implement
  - review
  - finish-branch
guidance: [G-08, G-09, G-20, G-22, G-32]
exit: >
  Every committed ticket is merged on a branch that references it, with passing tests at each
  tier the change touched, and the ticket is transitioned.
