id: verification
name: Verification
summary: >
  Confirming, from production and from the people who asked, that the release did what it
  claimed.
methodology:
  phase: 5
steps:
  - observability
  - validate-production
  - uat
  - review-ux
guidance: [G-15, G-22, G-47]
exit: >
  Production metrics match the baseline or regressions are ticketed; stakeholders have accepted
  the scenarios by name; usability findings are ticketed.
