# Agent harnesses the aa CLI installs into (decision record 0014). One entry per harness.
#
#   status        supported: the CLI installs into it; unsupported: detected and named, never installed into
#   verified      true once the install has been tried in the harness itself; false means the entry
#                 follows the harness's documentation only
#   detect        home: folders under the user's home that mean it is installed; command: its CLI
#   skills        the folders it reads SKILL.md skills from, user (home-relative) and project
#                 (repository-relative), in its own order of preference
#   commands      only where the harness needs command files to run a skill as a command:
#                 format markdown-arguments (Markdown, $ARGUMENTS), gemini-toml (TOML, {{args}}),
#                 or markdown-braces (Markdown, {{args}})
#   instructions  the project instruction file it reads, where aa init writes its block
#   subagents     true where the harness supports subagents (decision record 0015)
#   source        the documentation the entry was taken from, checked 2026-09-27
targets:
  - id: claude-code
    name: Claude Code
    status: supported
    verified: true
    detect: {home: [.claude], command: claude}
    skills: {user: [.claude/skills], project: [.claude/skills]}
    commands: {format: markdown-arguments, user: .claude/commands, project: .claude/commands}
    instructions: CLAUDE.md
    subagents: true
    source: https://code.claude.com/docs

  - id: codex
    name: Codex
    status: supported
    verified: false
    detect: {home: [.codex], command: codex}
    skills: {user: [.agents/skills], project: [.agents/skills]}
    instructions: AGENTS.md
    subagents: true
    source: https://learn.chatgpt.com/docs/build-skills

  - id: gemini-cli
    name: Gemini CLI
    status: supported
    verified: false
    detect: {home: [.gemini], command: gemini}
    skills: {user: [.gemini/skills, .agents/skills], project: [.gemini/skills, .agents/skills]}
    commands: {format: gemini-toml, user: .gemini/commands, project: .gemini/commands}
    instructions: GEMINI.md
    subagents: true
    source: https://geminicli.com/docs/cli/skills/

  - id: opencode
    name: OpenCode
    status: supported
    verified: false
    detect: {home: [.config/opencode], command: opencode}
    skills: {user: [.config/opencode/skills, .claude/skills, .agents/skills], project: [.opencode/skills, .claude/skills, .agents/skills]}
    commands: {format: markdown-arguments, user: .config/opencode/commands, project: .opencode/commands}
    instructions: AGENTS.md
    subagents: true
    source: https://opencode.ai/docs/skills/

  - id: pi
    name: Pi
    status: supported
    verified: false
    detect: {home: [.pi/agent], command: pi}
